name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain model from scratch
        run: python src/train.py

      - name: Run tests
        run: pytest -q
